<html>

    <head>
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Baloo+2:wght@700;800&display=swap" 
        rel="stylesheet">
        <style>
            
            * {
                margin: 0px;
                padding: 0px;
            }
            body {
                background-color: black;
            }
            .contenedor {
                width: 400px;
                height: 700px;
                background-color: rgb(247, 247, 70);
                position: relative;
                overflow: hidden;
                margin: 0 auto;
            }

            .coco1 {
                width: 80px;
                height: 80px;
                position: absolute;
                background-color: transparent;
                background-image: url(..//img/coco1.png);
                background-size: cover;
                top: -100px;
                left: 300px;
                z-index: 2;
                animation: coco1 4s 1s forwards;
            }
            .coco2 {
                width: 140px;
                height: 140px;
                position: absolute;
                background-color: transparent;
                background-image: url(../img/cocopng.png);
                background-size: cover;
                top: -190px;
                left: 110px;
                animation: coco2 4s 0.8s forwards;
            }
            .coco3 {
                width: 100px;
                height: 100px;
                position: absolute;
                 background-color: transparent;
                background-image: url(../img/cocopng.png);
                background-size: cover;
                transform: scaleX(-1);
                top: -100px;
                left: 250px;
                z-index: 2;
                animation: coco3 4s 0.4s forwards;
            }
            .coco4 {
                width: 80px;
                height: 80px;
                position: absolute;
                 background-color: transparent;
                background-image: url(../img/cocopng.png);
                background-size: cover;
                top: -100px;
                left: 20px;
                z-index: 2;
                animation: coco4 4s 0.2s forwards;
            }
            .coco5 {
                width: 200px;
                height: 200px;
                position: absolute;
                 background-color: transparent;
                background-image: url(../img/cocopng.png);
                background-size: cover;
                top: -100px;
                right: -20px;
                animation: coco5 4s 0s forwards;
            }
            .huevo {
                width: 50px;
                height: 80px;
                position: absolute;
                background-color: transparent;
                background-image: url(../img/huevopng.png);
                background-size: cover;
                transform: rotate(-90deg);
                top: -100px;
                left: 30px;
                animation: huevo 4s 1.2s forwards;
            }
            .palmera {
                width: 200px;
                height: 140px;
                position: absolute;
                background-color: transparent;
                background-image: url(../img/palm.png);
                background-size: cover;
                top: -20px;
                right: -10px;
                z-index: 1;
                animation: palm 10s ease forwards;
                animation-direction: alternate ;
            }
            @keyframes palm {
                0%{transform: rotate(0deg);}
                20%{transform: rotate(10deg)}
                40%{transform: rotate(-10deg)}
                60%{transform: rotate(10deg)}
                80%{transform: rotate(-10deg);}
                95%{opacity: 1;}
                100%{transform: rotate(10deg); opacity: 0;}
            }
            .ya-probaste {
                font-family: 'Oswald', sans-serif;
                letter-spacing: 6px;
                font-size: 28px;
                font-weight: 400;
                color: brown;

                position: absolute;
                top: 360px;
                left: -400px;
                font-size: 28px;
                font-weight: bold;
                color: #333;
                z-index: 3;
                animation: yaProbasteAnim 5s 0.5s forwards;
            }
            .el-nuevo {
                font-family: 'Baloo 2', sans-serif;
                font-size: 72px;
                font-weight: 800;
                line-height: 0.9;
                color: white;

                position: absolute;
                top: 400px;
                left: -400px;
                font-size: 64px;
                font-weight: 900;
                color: white;
                z-index: 3;
                animation: elNuevoAnim 5s 0.8s forwards;
            }
            .sabor {
                font-family: 'Baloo 2', sans-serif;
                font-size: 72px;
                font-weight: 800;
                line-height: 0.9;
                color: white;

                position: absolute;
                top: 480px;
                left: -400px;
                font-size: 64px;
                font-weight: 900;
                color: white;
                z-index: 3;
                animation: saborAnim 5s 1.1s forwards;
            }

            .textcoco{
                position: absolute;
                color: white;
                line-height: 0.9;
                font-family: 'Baloo 2', sans-serif;
                font-size: 140px;
                font-weight: 800;
                left: 400px;
                top: 200px;
                animation: textcoco 6s ease 4s forwards;
            }
            @keyframes textcoco {
                0%{
                    left: 400px;
                    top: 200px;
                }
                /* va a la izquierda */
                20%{
                    left: 20px;
                    top: 200px;
                }

                /* pausa */
                50%{
                    left: 20px;
                    top: 200px;
                }

                /* sigue en pausa */
                55%{
                    left: 20px;
                    top: 200px;
                }

                /* sube */
                60%{
                    left: 20px;
                    top: 140px;
                }
                80%{
                    left: 20px;
                    top: 140px;
                }
                90%{
                    left: 20px;
                    top: 140px;
                    transform: scale(1);
                    opacity: 1;
                }

                /* va a la derecha */
                100%{
                    left: -20px;
                    transform: scale(3);
                    opacity: 0;
                }
            }
            .textmas{
                position: absolute;
                color: rgb(144, 73, 73);
                font-family: 'Baloo 2', sans-serif;
                font-size: 100px;
                font-weight: 800;
                left: 400px;
                top: 230px;
                animation: textmas 6s ease 4s;
            }
            @keyframes textmas {
                0%{left: 400px; opacity: 1;}
                20%{left: 170px;opacity: 1;}
                70%{left: 170px;opacity: 1;}

                90%{left: 170px;opacity: 0;}
                100%{left: 400px;opacity: 0}
            }
            .textvainilla{
                position: absolute;
                color: white;
                line-height: 0.9;
                font-family: 'Baloo 2', sans-serif;
                font-size: 80px;
                font-weight: 800;
                left: 400px;
                top: 330px;
                animation: textv 6s ease 4s forwards;
            }
            @keyframes textv {
                
                0%{
                    left: 400px;
                    top: 330px;
                }
                /* va a la izquierda */
                20%{
                    left: 30px;
                    top: 330px;
                }

                /* pausa */
                50%{
                    left: 30px;
                    top: 330px;
                }

                /* sigue en pausa */
                55%{
                    left: 30px;
                    top: 330px;
                }

                /* sube */
                60%{
                    left: 30px;
                    top: 360px;
                }
                85%{
                    left: 30px;
                    top: 360px;
                }
                90%{
                    left: 30px;
                    top: 360px;
                    transform: scale(1);  
                    opacity: 1;  
                }
                100%{
                    left: -50px;
                    transform: scale(3);
                    opacity: 0;
                }
            }
            .cococentral{
                width: 100px;
                height: 100px;
                position: absolute;
                background-color: transparent;
                background-image: url(../img/cococentral.png);
                background-size: cover;
                top: 260px;
                left: 150px;
                animation: cococentrals 6s 4s forwards;
                opacity: 0;
            }
            @keyframes cococentrals {
                0%{
                    transform: scale(1); ;
                }

                20%{
                    transform: scale(1);
                }

            
                50%{
                    transform: scale(1);
                }

                
                55%{
                   transform: scale(1);
                }

                57%{transform: scale(1); opacity: 0;}
                60%{
                   transform: scale(4); opacity: 1;
                }
                70%{
                    transform: scale(2); opacity: 1;
                }
                90%{
                     transform: scale(2); opacity: 1;
                }
                100%{
                    transform: scale(6); opacity: 0;
                }
            }

            @keyframes coco1 {
                0%   { top: -100px; }
                40%  { top: 0px; }
                85%  { top: 0px; }
                100% { top: 800px; }
            }
            @keyframes coco2 {
                0%   { top: -190px; }
                40%  { top: 220px; }
                85%  { top: 220px; }
                100% { top: 800px; }
            }
            @keyframes coco3 {
                0%   { top: -100px; }
                40%  { top: 460px; }
                85%  { top: 460px; }
                100% { top: 800px; }
            }
            @keyframes coco4 {
                0%   { top: -100px; }
                40%  { top: 500px; }
                85%  { top: 500px; }
                100% { top: 800px; }
            }
            @keyframes coco5 {
                0%   { top: -100px; }
                40%  { top: 580px; }
                85%  { top: 580px; }
                100% { top: 800px; }
            }
            @keyframes huevo {
                0%   { top: -100px; }
                40%  { top: 10px; }
                85%  { top: 10px; }
                100% { top: 800px; }
            }

            @keyframes yaProbasteAnim {
                0%   { left: -400px; opacity: 0; }
                15%  { left: 20px;   opacity: 1; }
                75%  { left: 20px;   opacity: 1; }
                100% { left: 500px;  opacity: 0; }
            }
            @keyframes elNuevoAnim {
                0%   { left: -400px; opacity: 0; }
                15%  { left: 20px;   opacity: 1; }
                75%  { left: 20px;   opacity: 1; }
                100% { left: 500px;  opacity: 0; }
            }
            @keyframes saborAnim {
                0%   { left: -400px; opacity: 0; }
                15%  { left: 20px;   opacity: 1; }
                75%  { left: 20px;   opacity: 1; }
                100% { left: 500px;  opacity: 0; }
            }
        </style>
    </head>
    <body>
        <div class="contenedor">
            <div class="coco1"></div>
            <div class="coco2"></div>
            <div class="coco3"></div>
            <div class="coco4"></div>
            <div class="coco5"></div>
            <div class="huevo"></div>
            <div class="palmera"></div>
            <div class="ya-probaste">YA PROBASTE</div>
            <div class="el-nuevo">EL NUEVO</div>
            <div class="sabor">SABOR</div>
            <div class="textcoco">COCO</div>
            <div class="textmas">+</div>
            <div class="textvainilla">VAINILLA</div>
            <div class="cococentral"></div>
        </div>
    </body>
</html>
