<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIP PATH</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  background:#e5e5e5;
}
.container{
  width:200px;
  height:400px;
  background:black;
  position:relative;
  overflow:hidden;
  margin:30px auto;
}
.muneco{
  position:absolute;
  width:200px;
  height:400px;
  top:0;
  left:0;
}
.circle{
  width:100px;
  height:100px;
  background:#f5c16c;
  position:absolute;
  clip-path:circle(50%);
  left:50px;
  top:80px;
}
.cabeza{
  width:80px;
  height:80px;
  background:red;
  position:absolute;
  clip-path:polygon(50% 0%,0% 100%,100% 100%);
  left:60px;
  top:15px;
}
.torso{
  width:60px;
  height:180px;
  background:deepskyblue;
  position:absolute;
  clip-path:polygon(41% 0,58% 0,79% 100%,20% 100%);
  left:70px;
  top:180px;
}
.brazoderecho{
  width:60px;
  height:40px;
  background:purple;
  position:absolute;
  clip-path:polygon(0 1%,70% 0,99% 24%,71% 51%,0 52%);
  left:100px;
  top:195px;
}
.brazoizquierdo{
  width:60px;
  height:40px;
  background:purple;
  position:absolute;
  clip-path:polygon(0 1%,70% 0,99% 24%,71% 51%,0 52%);
  left:40px;
  top:195px;
  transform:scaleX(-1);
}
.piederecho{
  width:60px;
  height:40px;
  background:green;
  position:absolute;
  clip-path:ellipse(49% 26% at 50% 50%);
  left:100px;
  top:340px;
}
.pieizquierdo{
  width:60px;
  height:40px;
  background:green;
  position:absolute;
  clip-path:ellipse(49% 26% at 50% 50%);
  left:40px;
  top:340px;
}
</style>
</head>
<body>
<div class="container">
  <div class="muneco">
    <div class="circle"></div>
    <div class="cabeza"></div>
    <div class="torso"></div>
    <div class="brazoderecho"></div>
    <div class="brazoizquierdo"></div>
    <div class="piederecho"></div>
    <div class="pieizquierdo"></div>
  </div>
</div>
</body>
</html>
