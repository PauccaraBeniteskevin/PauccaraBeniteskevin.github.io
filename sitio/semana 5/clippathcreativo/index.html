<html>
  <head>
    <style>
      *{
        margin: 0;
        padding: 0;
        border: 0;
      }
      body{
        background-color: aqua;
        background: radial-gradient(circle at center, #ffeb3b, #f44336);
      }
      .contenedor{
        margin: 0 auto;
        position: relative;
        width: 400px;
        height: 650px;
        background-color: black;
        
      }
      .panel1, .panel2, .panel3, .panel4, .panel5, .panel6, .panel7, .panel8, .panel9{
        position: absolute;
        border: transparent;
      }
      .panel1{
        width: 250px;
        height: 210px;
        background-image: url(../img/viñeta1.png);
        background-size: cover;

        clip-path: polygon(0 0, 95% 0, 95% 91%, 0 81%);
      }
      .panel2{
        width: 150;
        height: 210px;
      background-image: url(../img/viñeta2.png);
      background-size: cover;

        left: 251px;
        clip-path: polygon(0 0, 100% 0, 100% 97%, 0 91%);
      }
      .panel3{
        width: 240px;
        height: 110px;
        background-image: url(../img/viñeta3.png);
        
      background-size: cover;
        
        top: 175px;
        clip-path: polygon(0 5%, 100% 25%, 100% 95%, 0 80%);
      }
      .panel4{
        width: 168px;
        height: 200px;

        top: 194px;
        left: 232px;
        background-image: url(../img/viñeta4.png);
      background-size: cover;

        clip-path: polygon(12% 5%, 100% 11%, 100% 95%, 12% 100%);
      }
      .panel5{
        height: 140px;
        width: 240px;
        top: 265px;
        background-image: url(../img/viñeta5.png);
        background-size: cover;
        

        clip-path: polygon(0 5%, 100% 17%, 100% 92%, 0 100%);
      }
      .panel6{
        height: 100px;
        width: 125px;
        top: 401px;
        background-image: url(../img/viñeta6.png);
      background-size: cover;
      

        clip-path: polygon(0 15%, 90% 10%, 85% 95%, 0 90%);
      }
      .panel7{
        height: 160px;   /*altura cambiada*/ 
        width: 125px;
        top: 490px;
       
        background-image: url(../img/viñeta7.png);
      background-size: cover;

        clip-path: polygon(0 5%, 85% 10%, 80% 100%, 0 100%);
      }
      .panel8{
        height: 130px;
        width: 303px;
        top: 380px;
        left: 97px;
        background-image: url(../img/viñeta8.png);
      background-size: cover;

        clip-path: polygon(7% 24%, 100% 10%, 100% 100%, 5% 90%);
      }
      .panel9{
        height: 150px;
        width: 300px;
        top: 500px;
        left: 101px;
        background-image: url(../img/viñeta9.png);
      background-size: cover;

        clip-path: polygon(4% 5%, 100% 15%, 100% 100%, 2% 100%);
      }

    </style>
  </head>
  <body>
    <div class="contenedor">
      <div class="panel1"></div>
      <div class="panel2"></div>
      <div class="panel3"></div>
      <div class="panel4"></div>
      <div class="panel5"></div>
      <div class="panel6"></div>
      <div class="panel7"></div>
      <div class="panel8"></div>
      <div class="panel9"></div>
    </div>

    

  </body>
</html>
