<html>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: black;
        }
        .contenedor{
            width: 400px;
            height: 700px;
            border: 1px solid white;
            overflow: hidden;
            margin: 0 auto;
            position: relative;
        }
        .paisaje{
            width: 800px;
            position: absolute;
            top: 300px;
            z-index: 2;
            animation: paisaje 10s 1 forwards;
        }
        @keyframes paisaje {
            from{
                top: 100px;
                filter: blur(2px);
            }to{
                top: 0px;
                filter: 0px;
            }
        }
        .cielo{
            width: 800px;
            left: -150px;
            position: absolute; 
            z-index: 1;
            animation: cielo 16s 1 forwards;
            

        }
        @keyframes cielo {
            from{
                scale: 100%;
                filter: blur(5px);
            }to{
                scale: 150%;
                filter: blur(0px);
            }
        }
        .persona{
            position: absolute;
            z-index: 3;
            left: -100px;
            width: 600px;
            top: 240px;
            transform: scale(1.3);
            animation: persona 6s 1 forwards;
        }
        @keyframes persona {
            from{
                top: 300px;
                scale: 100%;
                filter: grayscale(100%);
            }to{
                top: 220px;
                scale: 140%;
                filter: grayscale(0%);
            }
        }
        .vapor{
            position: absolute;
            width: 200%;
            z-index: 4;
            top: 400px;
            animation: vapor 5s 1 forwards;
        }
        @keyframes vapor {
            from{
                left: 0px;
            }to{
                left: -200px;
            }
        }
    </style>
    <body>
        <div class="contenedor">
            <img class="vapor" src="./img/VAPOR.png" alt="">
            <img class="paisaje" src="./img/fondo.png" alt="">
            <img class="cielo" src="./img/cielo.jpg" alt="">
            <img class="persona" src="./img/persona.png" alt="">
        </div>
    </body>
</html>
